name: NPM Publish on Tag

on:
  push:
    tags:
      - "*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js for NPM
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run format and lint checks
        run: bun run check

      - name: Run tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Publish to NPM
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Announce release with Herald
        run: node dist/index.cjs
        env:
          HERALD_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HERALD_AI_API_KEY: ${{ secrets.AI_API_KEY }}
          HERALD_AI_MODEL: ${{ vars.HERALD_AI_MODEL }}
          HERALD_REPO_NAME: ${{ github.event.repository.name }}
